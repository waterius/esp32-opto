<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560"
     font-family="Golos Text, Helvetica Neue, Arial, sans-serif">
<defs>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E6E9EC"/><stop offset=".5" stop-color="#C0C6CC"/><stop offset="1" stop-color="#9BA2AA"/>
  </linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#EDEFF2"/><stop offset=".45" stop-color="#B5BCC4"/>
    <stop offset=".7" stop-color="#DCE0E5"/><stop offset="1" stop-color="#A8B0B9"/>
  </linearGradient>
  <linearGradient id="puck" x1=".2" y1="0" x2=".7" y2="1">
    <stop offset="0" stop-color="#5D646E"/><stop offset=".55" stop-color="#3A404A"/><stop offset="1" stop-color="#282D35"/>
  </linearGradient>
  <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#A9B78C"/><stop offset="1" stop-color="#BCC79F"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E8F1F4"/><stop offset="1" stop-color="#D3E0E5"/>
  </linearGradient>
  <pattern id="bars" width="8" height="2" patternUnits="userSpaceOnUse">
    <rect width="2.2" height="2" fill="#2E3640"/>
    <rect x="3.6" width="1" height="2" fill="#2E3640"/>
    <rect x="5.8" width="1.6" height="2" fill="#2E3640"/>
  </pattern>

  <g id="scrS">
    <circle r="9" fill="url(#steel)" stroke="#8A9099" stroke-width="1.2"/>
    <path d="M-5 0H5M0 -5V5" stroke="#767C84" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g id="scrB">
    <circle r="11" fill="#CFAE4A" stroke="#9C8130" stroke-width="1.2"/>
    <path d="M-6 0H6M0 -6V6" stroke="#8A7129" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <g id="pad">
    <rect x="0" y="-7" width="18" height="14" rx="3" fill="#D8B45C" stroke="#A98A36" stroke-width="1"/>
    <circle cx="9" cy="0" r="3.4" fill="#2A2E35"/>
  </g>

  <linearGradient id="pcb" x1=".2" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#1C8455"/><stop offset=".55" stop-color="#127048"/><stop offset="1" stop-color="#0C5B3A"/>
  </linearGradient>
</defs>
<rect width="1240" height="560" fill="#FFFFFF"/>

