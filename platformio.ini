; esp32-opto — чтение счётчика НАРТИС через оптопорт + облако Waterius
;
; Сборка:   ~/.platformio/penv/bin/pio run -e esp32-s3
; Прошивка: ~/.platformio/penv/bin/pio run -e esp32-s3 -t upload
; Монитор:  ~/.platformio/penv/bin/pio device monitor
; Тесты:    ~/.platformio/penv/bin/pio test -e native

[platformio]
; native — только для юнит-тестов, `pio run` без -e его не собирает
default_envs = esp32-s3, esp32-c3

[env]
platform = espressif32@6.12.0
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    ; та же версия, что в прошивке Waterius
    ArduinoJson@7.3.1
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DOPTO_RX_PIN=17
    -DOPTO_TX_PIN=18

[env:esp32-c3]
board = esp32-c3-devkitm-1
; default.csv даёт всего 1.25 МБ на приложение — мало. min_spiffs:
; app0/app1 по 1.875 МБ (OTA сохраняется) + 128 КБ под LittleFS.
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    ; У C3 USB — это USB-Serial/JTAG (HWCDC). Без ARDUINO_USB_MODE=1
    ; Serial не объявляется ни в HWCDC.h, ни в USBCDC.h.
    ; У платы esp32-s3-devkitc-1 этот флаг уже есть в описании.
    -DARDUINO_USB_MODE=1
    -DOPTO_RX_PIN=4
    -DOPTO_TX_PIN=5

; Юнит-тесты протокола обмена со счётчиком на компьютере, без платы.
; Из src собирается только протокол: он не зависит от Arduino.
[env:native]
platform = native
framework =
lib_deps =
build_flags = -std=gnu++17 -Wall -DUNITY_INCLUDE_DOUBLE
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<core/dlms.cpp> +<core/nartis.cpp>
