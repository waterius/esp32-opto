; esp32-opto — счётчик НАРТИС через оптопорт + облако Waterius
;
; Сборка:   ~/.platformio/penv/bin/pio run -e esp32-s3 -e esp32-c3
; Прошивка: ~/.platformio/penv/bin/pio run -e esp32-s3 -t upload
; Образ ФС: ~/.platformio/penv/bin/pio run -e esp32-s3 -t uploadfs
; Монитор:  ~/.platformio/penv/bin/pio device monitor
; Тесты:    ~/.platformio/penv/bin/pio test -e native   (с задачи 2)
; Линтер:   ~/.platformio/penv/bin/pio check -e esp32-c3
;
; Результат сборки проверять по коду возврата pio, без grep/tail после него.

[platformio]
; native — только для тестов, `pio run` без -e его не собирает
default_envs = esp32-s3, esp32-c3

[firmware]
; уходит в облако полем fw; сервер Waterius сравнивает его с целевой версией OTA
version = "\"0.3.5\""

[env]
platform = espressif32@6.12.0
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    ; та же версия, что в прошивке Waterius
    ArduinoJson@7.3.1
    esp32async/ESPAsyncWebServer@^3.12.1
    esp32async/AsyncTCP@^3.5.0
    ayushsharma82/ElegantOTA@^4.0.0
    https://github.com/latonita/GuruxDLMS_c.git#a8c1b92564733d1921d77f17e5e1d8d4bf73f2a7
; Статический анализ: cppcheck приезжает вместе с PlatformIO, ставить нечего.
;
; Порог medium, а не low, по делу: на low из шести десятков находок пятьдесят с
; лишним — unusedFunction, и все ложные. cppcheck разбирает файл за файлом и не
; видит вызовов из соседнего, поэтому записывает в неиспользуемые net::loop,
; net::begin и WifiPolicy::step. Линтер, чьи находки приучаются пролистывать,
; не линтер.
;
; Подавления — построчные, через --inline-suppr: они стоят рядом с кодом, вместе
; с объяснением, и видны тому, кто этот код читает.
check_tool = cppcheck
check_severity = medium, high
check_skip_packages = yes
; Библиотеки из .pio/libdeps фильтр не отсекает: cppcheck разбирает их как
; включённые заголовки и спотыкается о препроцессор ArduinoJson. Это не наш код.
check_flags = cppcheck: --inline-suppr --std=c++17 --suppress=*:*/.pio/libdeps/*
check_src_filters = +<src/> +<test/>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -DFIRMWARE_VERSION=${firmware.version}

[env:esp32-s3]
board = esp32-s3-devkitc-1
; У S3 Super Mini на борту 4 МБ (ESP32-S3FH4R2), а описание платы
; esp32-s3-devkitc-1 обещает 8 — и образ, собранный под 8, в микросхему не
; влезает. Хуже того: esptool при flash_size=keep границы не проверяет,
; адреса заворачиваются по кругу, и хвост образа затирает загрузчик в нуле.
; Поэтому размер и таблица разделов задаются явно, как у C3.
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    ; У Super Mini на S3 выведены TX, RX и IO1–IO13: 17 и 18 на гребёнку не
    ; попали. 13 и 12 стоят вплотную к 3V3, GND и 5V — все пять проводов
    ; головки паяются в один ряд подряд.
    -DOPTO_RX_PIN=13
    -DOPTO_TX_PIN=12
    -DBOOT_PIN=0

[env:esp32-c3]
board = esp32-c3-devkitm-1
; default.csv даёт всего 1.25 МБ на приложение — мало. min_spiffs:
; app0/app1 по 1.875 МБ (OTA сохраняется) + 128 КБ под LittleFS.
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    ; У C3 USB — это USB-Serial/JTAG (HWCDC). Без ARDUINO_USB_MODE=1
    ; Serial не объявляется ни в HWCDC.h, ни в USBCDC.h.
    ; У платы esp32-s3-devkitc-1 этот флаг уже есть в описании.
    -DARDUINO_USB_MODE=1
    -DOPTO_RX_PIN=4
    -DOPTO_TX_PIN=5
    -DBOOT_PIN=9

; Юнит-тесты протокола обмена со счётчиком на компьютере, без платы.
; Из src собирается только адаптер: он не зависит от Arduino.
[env:native]
platform = native
framework =
lib_deps =
    ; та же версия, что в прошивке: core/cloud.cpp собирает тело запроса на ней
    ArduinoJson@7.3.1
    https://github.com/latonita/GuruxDLMS_c.git#a8c1b92564733d1921d77f17e5e1d8d4bf73f2a7
build_flags = -std=gnu++17 -Wall -DUNITY_INCLUDE_DOUBLE
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<core/nartis.cpp> +<core/wifi_policy.cpp> +<core/restart_reason.cpp> +<core/status_line.cpp> +<core/cloud.cpp> +<core/settings_io.cpp>
